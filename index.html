<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f2ee;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.09);
    --text: #1a1714;
    --muted: rgba(26,23,20,0.5);
    --accent: #7a5c38;
    --accent-dim: rgba(122,92,56,0.08);
  }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100svh; padding: 2rem 1.5rem; position: relative; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E"); background-size: 200px; pointer-events: none; z-index: 0; }
  .card { position: relative; z-index: 1; width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem 2rem 2rem; opacity: 0; transform: translateY(18px); animation: rise 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .card::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); border-radius: 1px; }
  .avatar-wrap { display: flex; justify-content: center; margin-bottom: 1.5rem; }
  .avatar { width: 80px; height: 80px; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; image-rendering: pixelated; }
  .avatar img { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .name { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; text-align: center; letter-spacing: 0.04em; color: var(--text); margin-bottom: 4px; }
  .title { font-size: 12px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: center; margin-bottom: 1.75rem; }
  .divider { width: 100%; height: 1px; background: var(--border); margin-bottom: 1.75rem; }
  .sns-list { display: flex; flex-direction: column; gap: 10px; }
  .sns-btn { display: flex; align-items: center; gap: 12px; padding: 13px 16px; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--text); text-decoration: none; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 400; letter-spacing: 0.02em; transition: background 0.2s, border-color 0.2s, transform 0.15s; cursor: pointer; opacity: 0; transform: translateY(10px); }
  .sns-btn:nth-child(1) { animation: rise 0.5s cubic-bezier(0.22,1,0.36,1) 0.55s forwards; }
  .sns-btn:nth-child(2) { animation: rise 0.5s cubic-bezier(0.22,1,0.36,1) 0.68s forwards; }
  .sns-btn:hover { background: var(--accent-dim); border-color: rgba(200,184,154,0.25); transform: translateY(-1px); }
  .sns-btn:active { transform: scale(0.98); }
  .sns-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; }
  .icon-x { background: rgba(255,255,255,0.06); }
  .icon-li { background: rgba(10,102,194,0.15); }
  .sns-icon svg { width: 16px; height: 16px; fill: currentColor; }
  .sns-label { flex: 1; }
  .sns-arrow { color: var(--muted); font-size: 16px; transition: transform 0.2s, color 0.2s; }
  .sns-btn:hover .sns-arrow { transform: translateX(3px); color: var(--accent); }
  .bio { font-size: 13px; line-height: 1.8; color: var(--muted); text-align: center; margin-bottom: 1.75rem; padding: 0 0.25rem; }
  .bio strong { color: var(--accent); font-weight: 400; }
  .footer { margin-top: 1.5rem; font-size: 11px; letter-spacing: 0.08em; color: rgba(26,23,20,0.25); text-align: center; text-transform: uppercase; opacity: 0; animation: rise 0.5s ease 0.9s forwards; }
</style>
