<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작품 해설 · Artwork Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #14110e;
    --bg-2: #1c1815;
    --surface: #221d18;
    --surface-2: #2a241e;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #f3ede3;
    --muted: rgba(243,237,227,0.55);
    --faint: rgba(243,237,227,0.32);
    --accent: #c9a86a;
    --accent-dim: rgba(201,168,106,0.12);
  }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% -10%, #23201b 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    padding-bottom: 4rem;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(20,17,14,0.82);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner { max-width: 1120px; margin: 0 auto; padding: 1.15rem 1.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; line-height: 1.25; }
  .brand .eyebrow { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
  .brand h1 { font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 20px; letter-spacing: 0.01em; }
  .search-wrap { margin-left: auto; position: relative; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; fill: var(--faint); }
  #search {
    width: 220px; max-width: 46vw; background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; color: var(--text); font-family: inherit; font-size: 13px; font-weight: 300;
    padding: 9px 16px 9px 34px; outline: none; transition: border-color .2s, width .2s;
  }
  #search::placeholder { color: var(--faint); }
  #search:focus { border-color: var(--border-strong); }

  /* ---------- Filters ---------- */
  .filters { max-width: 1120px; margin: 1.6rem auto 0; padding: 0 1.5rem; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-family: inherit; font-size: 12.5px; font-weight: 400; letter-spacing: 0.02em;
    color: var(--muted); background: transparent; border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 15px; cursor: pointer; transition: all .18s;
  }
  .chip:hover { color: var(--text); border-color: var(--border-strong); }
  .chip.active { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 500; }

  .count { max-width: 1120px; margin: 1.1rem auto 0; padding: 0 1.5rem; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }

  /* ---------- Grid ---------- */
  .grid {
    max-width: 1120px; margin: 0.9rem auto 0; padding: 0 1.5rem;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.4rem;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    transition: transform .25s cubic-bezier(.22,1,.36,1), border-color .25s, box-shadow .25s;
    animation: fade .5s ease backwards;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--border-strong); box-shadow: 0 18px 40px -22px rgba(0,0,0,0.8); }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } }
  .thumb { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--bg-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.22,1,.36,1); }
  .card:hover .thumb img { transform: scale(1.06); }
  .thumb .fallback {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    padding: 1rem; font-family: 'Cormorant Garamond', serif; font-size: 15px; color: rgba(255,255,255,0.7);
  }
  .cat-tag {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text);
    background: rgba(20,17,14,0.7); backdrop-filter: blur(6px); border: 1px solid var(--border);
    padding: 4px 9px; border-radius: 999px;
  }
  .card-body { padding: 0.95rem 1.05rem 1.1rem; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-body .t { font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 15.5px; line-height: 1.35; }
  .card-body .a { font-size: 12.5px; color: var(--muted); }
  .card-body .y { margin-top: auto; padding-top: 8px; font-size: 11px; letter-spacing: 0.06em; color: var(--faint); }

  .empty { max-width: 1120px; margin: 3rem auto; padding: 0 1.5rem; text-align: center; color: var(--muted); font-size: 14px; }

  /* ---------- Detail overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 40; background: rgba(10,8,6,0.72); backdrop-filter: blur(8px);
    display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 3vh 1.2rem;
  }
  .overlay.open { display: flex; animation: ovin .25s ease; }
  @keyframes ovin { from { opacity: 0; } }
  .detail {
    position: relative; width: 100%; max-width: 820px; background: var(--bg-2);
    border: 1px solid var(--border-strong); border-radius: 18px; overflow: hidden;
    animation: rise .4s cubic-bezier(.22,1,.36,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  .detail-hero { position: relative; width: 100%; background: #0d0b09; }
  .detail-hero img { width: 100%; max-height: 60vh; object-fit: contain; display: block; }
  .close {
    position: absolute; top: 12px; right: 12px; z-index: 3; width: 38px; height: 38px; border-radius: 50%;
    background: rgba(20,17,14,0.7); backdrop-filter: blur(6px); border: 1px solid var(--border);
    color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .close:hover { background: rgba(20,17,14,0.95); }
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 42px; height: 42px; border-radius: 50%;
    background: rgba(20,17,14,0.6); backdrop-filter: blur(6px); border: 1px solid var(--border);
    color: var(--text); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .2s, opacity .2s;
  }
  .nav-btn:hover { background: rgba(20,17,14,0.92); }
  .nav-btn.prev { left: 12px; }
  .nav-btn.next { right: 12px; }
  .detail-body { padding: 1.8rem 2rem 2.2rem; }
  .detail-cat { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
  .detail-title { font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: 26px; line-height: 1.3; margin-top: 6px; }
  .detail-sub { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin: 1.5rem 0; }
  .meta div { background: var(--surface); padding: 12px 14px; }
  .meta .k { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
  .meta .v { font-size: 13.5px; color: var(--text); font-weight: 400; }
  .audio-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 1.6rem; }
  .audio-btn {
    display: inline-flex; align-items: center; gap: 9px; font-family: inherit; font-size: 13.5px; font-weight: 500;
    color: var(--bg); background: var(--accent); border: none; border-radius: 999px; padding: 10px 18px; cursor: pointer;
    transition: filter .2s, transform .1s;
  }
  .audio-btn:hover { filter: brightness(1.08); }
  .audio-btn:active { transform: scale(.97); }
  .audio-btn svg { width: 15px; height: 15px; fill: currentColor; }
  .audio-note { font-size: 11.5px; color: var(--faint); }
  .desc p { font-size: 15px; line-height: 1.95; color: rgba(243,237,227,0.85); margin-bottom: 1.05rem; font-weight: 300; }
  .desc p:last-child { margin-bottom: 0; }
  .desc strong { color: var(--accent); font-weight: 500; }
  .detail-footer { margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid var(--border); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }

  footer.page-footer { max-width: 1120px; margin: 3.5rem auto 0; padding: 2rem 1.5rem 0; border-top: 1px solid var(--border); text-align: center; font-size: 11.5px; letter-spacing: 0.1em; color: var(--faint); }

  @media (max-width: 560px) {
    .header-inner { padding: 1rem 1.1rem; }
    .brand h1 { font-size: 17px; }
    #search { width: 150px; }
    .grid { padding: 0 1.1rem; gap: 1.1rem; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .filters, .count { padding: 0 1.1rem; }
    .detail-body { padding: 1.4rem 1.3rem 1.8rem; }
    .detail-title { font-size: 22px; }
    .detail-hero img { max-height: 48vh; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <span class="eyebrow">Artwork Guide</span>
      <h1>소장품 작품 해설</h1>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="search" type="search" placeholder="작품·작가 검색" autocomplete="off" aria-label="작품 검색">
    </div>
  </div>
</header>

<nav class="filters" id="filters" aria-label="분류 필터"></nav>
<p class="count" id="count"></p>
<main class="grid" id="grid" aria-live="polite"></main>
<p class="empty" id="empty" style="display:none;">검색 결과가 없습니다.</p>

<footer class="page-footer">
  소장품 작품 해설 · 오디오 가이드 지원 · 모든 이미지는 퍼블릭 도메인
</footer>

<!-- Detail overlay -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <article class="detail" id="detail"></article>
</div>

/* ---------------------------------------------------------------
   상태 및 렌더링
   --------------------------------------------------------------- */
const CATS = ["전체", ...Array.from(new Set(ARTWORKS.map(a => a.cat)))];
let activeCat = "전체";
let query = "";
let currentList = [];
let currentIndex = -1;

const gridEl = document.getElementById("grid");
const filtersEl = document.getElementById("filters");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const overlay = document.getElementById("overlay");
const detailEl = document.getElementById("detail");
const searchEl = document.getElementById("search");

/* 이미지 로드 실패 시 그라데이션 대체 */
function attachFallback(img, art) {
  img.addEventListener("error", () => {
    const t = img.closest(".thumb, .detail-hero");
    if (!t) return;
    img.style.display = "none";
    let fb = t.querySelector(".fallback");
    const grad = `linear-gradient(150deg, ${art.hue}, #14110e)`;
    if (!fb) {
      fb = document.createElement("div");
      fb.className = "fallback";
      fb.innerHTML = `<span>${art.original}</span>`;
      t.appendChild(fb);
    }
    t.style.background = grad;
    fb.style.display = "flex";
    if (t.classList.contains("detail-hero")) t.style.minHeight = "260px";
  }, { once: true });
}

function renderFilters() {
  filtersEl.innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c === activeCat ? " active" : "");
    b.textContent = c;
    b.onclick = () => { activeCat = c; render(); };
    filtersEl.appendChild(b);
  });
}

function getFiltered() {
  const q = query.trim().toLowerCase();
  return ARTWORKS.filter(a => {
    const catOk = activeCat === "전체" || a.cat === activeCat;
    const qOk = !q || [a.title, a.original, a.artist, a.movement].join(" ").toLowerCase().includes(q);
    return catOk && qOk;
  });
}

function render() {
  renderFilters();
  currentList = getFiltered();
  gridEl.innerHTML = "";
  countEl.textContent = `${currentList.length}점의 작품`;
  emptyEl.style.display = currentList.length ? "none" : "block";

  currentList.forEach((a, i) => {
    const card = document.createElement("article");
    card.className = "card";
    card.style.animationDelay = (i * 0.04) + "s";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", `${a.title}, ${a.artist}`);
    card.innerHTML = `
      <div class="thumb">
        <span class="cat-tag">${a.cat}</span>
        <img src="${a.img}" alt="${a.title} - ${a.artist}" loading="lazy">
      </div>
      <div class="card-body">
        <div class="t">${a.title}</div>
        <div class="a">${a.artist}</div>
        <div class="y">${a.year} · ${a.movement}</div>
      </div>`;
    attachFallback(card.querySelector("img"), a);
    const open = () => openDetail(a.id);
    card.addEventListener("click", open);
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    gridEl.appendChild(card);
  });
}

/* ---------------------------------------------------------------
   상세 보기 + 오디오 가이드 (Web Speech API)
   --------------------------------------------------------------- */
function stripTags(html) { return html.replace(/<[^>]+>/g, ""); }

function openDetail(id) {
  currentIndex = currentList.findIndex(a => a.id === id);
  if (currentIndex < 0) {
    currentList = ARTWORKS;
    currentIndex = ARTWORKS.findIndex(a => a.id === id);
  }
  renderDetail();
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
  detailEl.scrollTop = 0;
}

  attachFallback(detailEl.querySelector(".detail-hero img"), a);
  detailEl.querySelector(".close").onclick = closeDetail;
  const prev = detailEl.querySelector(".prev");
  const next = detailEl.querySelector(".next");
  if (prev) prev.onclick = () => step(-1);
  if (next) next.onclick = () => step(1);
  setupAudio(a);
}

function step(dir) {
  const ni = currentIndex + dir;
  if (ni < 0 || ni >= currentList.length) return;
  stopSpeech();
  currentIndex = ni;
  renderDetail();
  detailEl.scrollTop = 0;
}

function closeDetail() {
  overlay.classList.remove("open");
  document.body.style.overflow = "";
  stopSpeech();
}

/* --- 음성 합성 --- */
let speaking = false;
const synth = window.speechSynthesis;

function stopSpeech() {
  if (synth) synth.cancel();
  speaking = false;
}

function setupAudio(a) {
  const btn = document.getElementById("audioBtn");
  const label = document.getElementById("audioLabel");
  const note = document.getElementById("audioNote");
  if (!synth) {
    btn.disabled = true;
    btn.style.opacity = ".5";
    btn.style.cursor = "not-allowed";
    note.textContent = "이 브라우저는 음성 안내를 지원하지 않습니다";
    return;
  }
  const text = `${a.title}. ${a.artist}, ${a.year}. ` + a.desc.map(stripTags).join(" ");
  const setIdle = () => { speaking = false; label.textContent = "오디오 가이드 듣기"; };
  btn.onclick = () => {
    if (speaking) { stopSpeech(); setIdle(); return; }
    stopSpeech();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    u.rate = 0.98;
    u.pitch = 1.0;
    const voices = synth.getVoices();
    const ko = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ko"));
    if (ko) u.voice = ko;
    u.onend = setIdle;
    u.onerror = setIdle;
    synth.speak(u);
    speaking = true;
    label.textContent = "재생 중지";
  };
}
if (synth) synth.onvoiceschanged = () => {};

/* ---------------------------------------------------------------
   이벤트
   --------------------------------------------------------------- */
searchEl.addEventListener("input", e => { query = e.target.value; render(); });
overlay.addEventListener("click", e => { if (e.target === overlay) closeDetail(); });
document.addEventListener("keydown", e => {
  if (!overlay.classList.contains("open")) return;
  if (e.key === "Escape") closeDetail();
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});

render();
</script>
</body>
</html>
